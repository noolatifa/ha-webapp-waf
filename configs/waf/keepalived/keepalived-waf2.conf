global_defs {
    enable_script_security
    script_user root
}

vrrp_script chk_waf {
    script "/usr/libexec/keepalived/check_waf.sh"
    interval 2
    fall 2
    rise 2
}




vrrp_instance VI_WAF {
    state BACKUP
    interface ens224
    virtual_router_id 51
    priority 100
    advert_int 1
    unicast_src_ip 10.0.1.4
    unicast_peer {
        10.0.1.3
    }
    virtual_ipaddress {
        192.168.80.100/24 dev ens160
    }

    track_script {
        chk_waf
    }


}
