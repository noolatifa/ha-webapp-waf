<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1010" viewBox="0 0 900 1010" font-family="Arial, Helvetica, sans-serif">
  <title>HA web application behind an open-source WAF - architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="1010" rx="0" fill="#FFFFFF"/>

  <!-- WAN -->
  <rect x="20" y="20" width="860" height="56" rx="4" fill="none" stroke="#8C8C8C" stroke-dasharray="5 4"/>
  <text x="450" y="43" text-anchor="middle" fill="#1F1F1F" font-size="15" font-weight="600">WAN - clients</text>
  <text x="450" y="63" text-anchor="middle" fill="#555555" font-size="12.5">VMnet2 192.168.80.0/24 - admin host .254 - hosts file: www.latifa.test -&gt; VIP</text>
  <line x1="450" y1="76" x2="450" y2="122" stroke="#555555" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="460" y="104" fill="#555555" font-size="12.5">HTTPS :443 (HTTP :80 -&gt; 301)</text>

  <!-- DMZ -->
  <rect x="20" y="112" width="860" height="330" rx="4" fill="none" stroke="#8C8C8C" stroke-dasharray="5 4"/>
  <text x="36" y="134" fill="#1F1F1F" font-size="13.5" font-weight="600">Zone 2 - DMZ - WAF / LB cluster</text>

  <rect x="320" y="126" width="260" height="54" rx="4" fill="#FFF4CC" stroke="#D9A400"/>
  <text x="450" y="148" text-anchor="middle" fill="#4D3800" font-size="15" font-weight="600">VIP 192.168.80.100</text>
  <text x="450" y="168" text-anchor="middle" fill="#7A5C00" font-size="12.5">443 HTTPS - 80 redirect only</text>
  <line x1="380" y1="180" x2="250" y2="204" stroke="#555555" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="520" y1="180" x2="650" y2="204" stroke="#555555" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#a)"/>

  <!-- waf1 -->
  <rect x="40" y="206" width="360" height="220" rx="4" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.3"/>
  <text x="220" y="230" text-anchor="middle" fill="#1F1F1F" font-size="15" font-weight="600">VM waf1 - RHEL 9.5 - MASTER</text>
  <text x="220" y="251" text-anchor="middle" fill="#333333" font-size="12.5">ens160 WAN 192.168.80.11</text>
  <text x="220" y="269" text-anchor="middle" fill="#333333" font-size="12.5">ens224 f1 .1.3 - ens256 f2 .2.3</text>
  <rect x="60" y="282" width="320" height="28" rx="3" fill="#FDE2EC" stroke="#D6457A"/>
  <text x="220" y="301" text-anchor="middle" fill="#6B1A3D" font-size="12.5">keepalived - VRRP unicast - WAF health check</text>
  <rect x="60" y="318" width="320" height="28" rx="3" fill="#FDE2EC" stroke="#D6457A"/>
  <text x="220" y="337" text-anchor="middle" fill="#6B1A3D" font-size="12.5">nginx reverse proxy / LB + ModSecurity v3 + CRS</text>
  <rect x="60" y="354" width="320" height="28" rx="3" fill="#FDE2EC" stroke="#D6457A"/>
  <text x="220" y="373" text-anchor="middle" fill="#6B1A3D" font-size="12.5">TLS 1.2/1.3 - www.latifa.test (lab CA) - HSTS</text>
  <text x="220" y="400" text-anchor="middle" fill="#333333" font-size="12.5">firewalld: SSH from .254 only, VRRP from peer</text>
  <text x="220" y="418" text-anchor="middle" fill="#333333" font-size="12.5">SELinux - lab CA in /root/lab-ca</text>

  <!-- waf2 -->
  <rect x="500" y="206" width="360" height="220" rx="4" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.3"/>
  <text x="680" y="230" text-anchor="middle" fill="#1F1F1F" font-size="15" font-weight="600">VM waf2 - RHEL 9.5 - BACKUP</text>
  <text x="680" y="251" text-anchor="middle" fill="#333333" font-size="12.5">ens160 WAN 192.168.80.12</text>
  <text x="680" y="269" text-anchor="middle" fill="#333333" font-size="12.5">ens224 f1 .1.4 - ens161 f2 .2.4</text>
  <rect x="520" y="282" width="320" height="28" rx="3" fill="#FDE2EC" stroke="#D6457A"/>
  <text x="680" y="301" text-anchor="middle" fill="#6B1A3D" font-size="12.5">keepalived - VRRP unicast - WAF health check</text>
  <rect x="520" y="318" width="320" height="28" rx="3" fill="#FDE2EC" stroke="#D6457A"/>
  <text x="680" y="337" text-anchor="middle" fill="#6B1A3D" font-size="12.5">nginx reverse proxy / LB + ModSecurity v3 + CRS</text>
  <rect x="520" y="354" width="320" height="28" rx="3" fill="#FDE2EC" stroke="#D6457A"/>
  <text x="680" y="373" text-anchor="middle" fill="#6B1A3D" font-size="12.5">TLS 1.2/1.3 - www.latifa.test (lab CA) - HSTS</text>
  <text x="680" y="400" text-anchor="middle" fill="#333333" font-size="12.5">firewalld: SSH from .254 only, VRRP from peer</text>
  <text x="680" y="418" text-anchor="middle" fill="#333333" font-size="12.5">SELinux</text>

  <line x1="400" y1="306" x2="500" y2="306" stroke="#555555" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="450" y="296" text-anchor="middle" fill="#555555" font-size="12.5">VRRP</text>
  <text x="450" y="324" text-anchor="middle" fill="#555555" font-size="12.5">front1</text>

  <!-- LAN zone -->
  <rect x="20" y="460" width="860" height="500" rx="4" fill="none" stroke="#8C8C8C" stroke-dasharray="5 4"/>
  <rect x="40" y="480" width="820" height="440" rx="4" fill="#FAFAF7" stroke="#3A3A3A" stroke-width="1.3"/>

  <!-- WAF to VLANs -->
  <line x1="150" y1="426" x2="150" y2="498" stroke="#555555" stroke-width="1.2"/>
  <text x="160" y="455" fill="#555555" font-size="12.5">HTTP :80</text>
  <line x1="300" y1="426" x2="620" y2="498" stroke="#555555" stroke-width="1.2"/>
  <line x1="600" y1="426" x2="290" y2="498" stroke="#555555" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="760" y1="426" x2="760" y2="498" stroke="#555555" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- front1 -->
  <rect x="60" y="500" width="340" height="150" rx="4" fill="#FFF4CC" stroke="#D9A400"/>
  <text x="230" y="524" text-anchor="middle" fill="#4D3800" font-size="15" font-weight="600">VLAN front1 - 10.0.1.0/29</text>
  <text x="230" y="544" text-anchor="middle" fill="#7A5C00" font-size="12.5">LAN segment - waf1 .3 - waf2 .4</text>
  <rect x="100" y="560" width="260" height="60" rx="4" fill="#FDE2EC" stroke="#D6457A"/>
  <text x="230" y="584" text-anchor="middle" fill="#6B1A3D" font-size="15" font-weight="600">app1 - DVWA</text>
  <text x="230" y="605" text-anchor="middle" fill="#9C3460" font-size="12.5">10.0.1.2 - macvlan (ens160)</text>

  <!-- front2 -->
  <rect x="500" y="500" width="340" height="150" rx="4" fill="#FFF4CC" stroke="#D9A400"/>
  <text x="670" y="524" text-anchor="middle" fill="#4D3800" font-size="15" font-weight="600">VLAN front2 - 10.0.2.0/29</text>
  <text x="670" y="544" text-anchor="middle" fill="#7A5C00" font-size="12.5">LAN segment - waf1 .3 - waf2 .4</text>
  <rect x="540" y="560" width="260" height="60" rx="4" fill="#FDE2EC" stroke="#D6457A"/>
  <text x="670" y="584" text-anchor="middle" fill="#6B1A3D" font-size="15" font-weight="600">app2 - DVWA</text>
  <text x="670" y="605" text-anchor="middle" fill="#9C3460" font-size="12.5">10.0.2.2 - macvlan (ens224)</text>

  <!-- net-data -->
  <rect x="60" y="680" width="780" height="180" rx="4" fill="#FFF4CC" stroke="#D9A400"/>
  <path d="M150 620 V736" fill="none" stroke="#555555" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="160" y="660" fill="#555555" font-size="12.5">access 10.0.3.5</text>
  <path d="M670 620 V706 H215 V736" fill="none" stroke="#555555" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="680" y="660" fill="#555555" font-size="12.5">access 10.0.3.6</text>
  <text x="440" y="698" text-anchor="middle" fill="#4D3800" font-size="12.5">SQL :3306 -&gt; db1</text>

  <rect x="90" y="740" width="170" height="56" rx="4" fill="#FDE2EC" stroke="#D6457A"/>
  <text x="175" y="763" text-anchor="middle" fill="#6B1A3D" font-size="15" font-weight="600">db1 MariaDB</text>
  <text x="175" y="783" text-anchor="middle" fill="#9C3460" font-size="12.5">primary 10.0.3.2</text>
  <rect x="290" y="740" width="160" height="56" rx="4" fill="none" stroke="#D6457A" stroke-dasharray="5 4"/>
  <text x="370" y="763" text-anchor="middle" fill="#6B1A3D" font-size="15" font-weight="600">HAProxy SQL</text>
  <text x="370" y="783" text-anchor="middle" fill="#9C3460" font-size="12.5">V2 - 10.0.3.4</text>
  <rect x="480" y="740" width="170" height="56" rx="4" fill="#FDE2EC" stroke="#D6457A"/>
  <text x="565" y="763" text-anchor="middle" fill="#6B1A3D" font-size="15" font-weight="600">db2 MariaDB</text>
  <text x="565" y="783" text-anchor="middle" fill="#9C3460" font-size="12.5">replica 10.0.3.3</text>
  <rect x="680" y="740" width="130" height="56" rx="4" fill="none" stroke="#D6457A" stroke-dasharray="5 4"/>
  <text x="745" y="763" text-anchor="middle" fill="#6B1A3D" font-size="15" font-weight="600">backup</text>
  <text x="745" y="783" text-anchor="middle" fill="#9C3460" font-size="12.5">V2</text>
  <path d="M175 796 V810 H565 V800" fill="none" stroke="#7A5C00" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#a)"/>

  <text x="450" y="832" text-anchor="middle" fill="#4D3800" font-size="14" font-weight="600">VLAN net-data - 10.0.3.0/28 - internal - databases only</text>
  <text x="450" y="851" text-anchor="middle" fill="#7A5C00" font-size="12.5">bridge br-netdata (.1) - encrypted GTID replication db1 -&gt; db2</text>

  <text x="450" y="884" text-anchor="middle" fill="#555555" font-size="12.5">front1 and front2 enter the VM through ens160 and ens224 (parent interfaces, no IP)</text>
  <text x="450" y="906" text-anchor="middle" fill="#1F1F1F" font-size="14" font-weight="600">VM lan - RHEL 9.5 + Docker Compose</text>
  <text x="36" y="946" fill="#1F1F1F" font-size="13.5" font-weight="600">Zone 3 - LAN</text>

  <!-- legend -->
  <rect x="40" y="978" width="14" height="14" rx="3" fill="#FFF4CC" stroke="#D9A400"/>
  <text x="62" y="990" fill="#333333" font-size="12.5">VLAN / VIP</text>
  <rect x="160" y="978" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.3"/>
  <text x="182" y="990" fill="#333333" font-size="12.5">VM</text>
  <rect x="230" y="978" width="14" height="14" rx="3" fill="#FDE2EC" stroke="#D6457A"/>
  <text x="252" y="990" fill="#333333" font-size="12.5">Service</text>
  <text x="330" y="990" fill="#333333" font-size="12.5">access = application interface in net-data</text>
  <line x1="640" y1="985" x2="680" y2="985" stroke="#555555" stroke-dasharray="5 4"/>
  <text x="690" y="990" fill="#333333" font-size="12.5">standby path / V2</text>
</svg>
