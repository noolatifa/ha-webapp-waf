<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1060" viewBox="0 0 900 1060" font-family="Arial, Helvetica, sans-serif">
  <title>HA web application behind an open-source WAF - architecture (V3)</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="1060" rx="0" fill="#FFFFFF"/>

  <!-- WAN -->
  <rect x="20" y="20" width="860" height="56" rx="4" fill="none" stroke="#8C8C8C" stroke-dasharray="5 4"/>
  <text x="450" y="43" text-anchor="middle" fill="#1F1F1F" font-size="15" font-weight="600">WAN - clients</text>
  <text x="450" y="63" text-anchor="middle" fill="#555555" font-size="12.5">VMnet2 192.168.80.0/24 - admin host .254 - hosts file: www.latifa.test -&gt; VIP</text>
  <line x1="450" y1="76" x2="450" y2="122" stroke="#555555" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="460" y="104" fill="#555555" font-size="12.5">HTTPS :443 (HTTP :80 -&gt; 301)</text>

  <!-- DMZ -->
  <rect x="20" y="112" width="860" height="330" rx="4" fill="none" stroke="#8C8C8C" stroke-dasharray="5 4"/>
  <text x="36" y="134" fill="#1F1F1F" font-size="13.5" font-weight="600">Zone 2 - DMZ - WAF / LB cluster</text>

  <rect x="320" y="126" width="260" height="54" rx="4" fill="#FFF4CC" stroke="#D9A400"/>
  <text x="450" y="148" text-anchor="middle" fill="#4D3800" font-size="15" font-weight="600">VIP 192.168.80.100</text>
  <text x="450" y="168" text-anchor="middle" fill="#7A5C00" font-size="12.5">443 HTTPS - 80 redirect only</text>
  <line x1="380" y1="180" x2="250" y2="204" stroke="#555555" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="520" y1="180" x2="650" y2="204" stroke="#555555" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#a)"/>

  <!-- waf1 -->
  <rect x="40" y="206" width="360" height="220" rx="4" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.3"/>
  <text x="220" y="230" text-anchor="middle" fill="#1F1F1F" font-size="15" font-weight="600">VM waf1 - RHEL 9.5 - MASTER</text>
  <text x="220" y="251" text-anchor="middle" fill="#333333" font-size="12.5">ens160 WAN 192.168.80.11</text>
  <text x="220" y="269" text-anchor="middle" fill="#333333" font-size="12.5">ens224 f1 .1.3 - ens256 f2 .2.3</text>
  <rect x="60" y="282" width="320" height="28" rx="3" fill="#FDE2EC" stroke="#D6457A"/>
  <text x="220" y="301" text-anchor="middle" fill="#6B1A3D" font-size="12.5">keepalived - VRRP unicast - WAF health check</text>
  <rect x="60" y="318" width="320" height="28" rx="3" fill="#FDE2EC" stroke="#D6457A"/>
  <text x="220" y="337" text-anchor="middle" fill="#6B1A3D" font-size="12.5">nginx reverse proxy / LB + ModSecurity v3 + CRS</text>
  <rect x="60" y="354" width="320" height="28" rx="3" fill="#FDE2EC" stroke="#D6457A"/>
  <text x="220" y="373" text-anchor="middle" fill="#6B1A3D" font-size="12.5">TLS 1.2/1.3 - www.latifa.test (lab CA) - HSTS</text>
  <text x="220" y="400" text-anchor="middle" fill="#333333" font-size="12.5">firewalld: SSH from .254 only, VRRP from peer</text>
  <text x="220" y="418" text-anchor="middle" fill="#333333" font-size="12.5">SELinux - lab CA - /dashboard (admin host)</text>

  <!-- waf2 -->
  <rect x="500" y="206" width="360" height="220" rx="4" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.3"/>
  <text x="680" y="230" text-anchor="middle" fill="#1F1F1F" font-size="15" font-weight="600">VM waf2 - RHEL 9.5 - BACKUP</text>
  <text x="680" y="251" text-anchor="middle" fill="#333333" font-size="12.5">ens160 WAN 192.168.80.12</text>
  <text x="680" y="269" text-anchor="middle" fill="#333333" font-size="12.5">ens224 f1 .1.4 - ens256 f2 .2.4</text>
  <rect x="520" y="282" width="320" height="28" rx="3" fill="#FDE2EC" stroke="#D6457A"/>
  <text x="680" y="301" text-anchor="middle" fill="#6B1A3D" font-size="12.5">keepalived - VRRP unicast - WAF health check</text>
  <rect x="520" y="318" width="320" height="28" rx="3" fill="#FDE2EC" stroke="#D6457A"/>
  <text x="680" y="337" text-anchor="middle" fill="#6B1A3D" font-size="12.5">nginx reverse proxy / LB + ModSecurity v3 + CRS</text>
  <rect x="520" y="354" width="320" height="28" rx="3" fill="#FDE2EC" stroke="#D6457A"/>
  <text x="680" y="373" text-anchor="middle" fill="#6B1A3D" font-size="12.5">TLS 1.2/1.3 - www.latifa.test (lab CA) - HSTS</text>
  <text x="680" y="400" text-anchor="middle" fill="#333333" font-size="12.5">firewalld: SSH from .254 only, VRRP from peer</text>
  <text x="680" y="418" text-anchor="middle" fill="#333333" font-size="12.5">SELinux - /dashboard (admin host)</text>

  <line x1="400" y1="306" x2="500" y2="306" stroke="#555555" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="450" y="296" text-anchor="middle" fill="#555555" font-size="12.5">VRRP</text>
  <text x="450" y="324" text-anchor="middle" fill="#555555" font-size="12.5">front1</text>

  <!-- Zone 3: application tier -->
  <rect x="20" y="460" width="860" height="272" rx="4" fill="none" stroke="#8C8C8C" stroke-dasharray="5 4"/>
  <line x1="150" y1="426" x2="150" y2="498" stroke="#555555" stroke-width="1.2"/>
  <text x="160" y="455" fill="#555555" font-size="12.5">HTTP :80</text>
  <line x1="300" y1="426" x2="620" y2="498" stroke="#555555" stroke-width="1.2"/>
  <line x1="600" y1="426" x2="290" y2="498" stroke="#555555" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="760" y1="426" x2="760" y2="498" stroke="#555555" stroke-width="1.2" stroke-dasharray="5 4"/>
  <rect x="60" y="500" width="340" height="200" rx="4" fill="#FFF4CC" stroke="#D9A400"/>
  <text x="230" y="522" text-anchor="middle" fill="#4D3800" font-size="15" font-weight="600">VLAN front1 - 10.0.1.0/29</text>
  <text x="230" y="540" text-anchor="middle" fill="#7A5C00" font-size="12.5">LAN segment - waf1 .3 - waf2 .4</text>
  <rect x="80" y="552" width="300" height="140" rx="4" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.3"/>
  <text x="230" y="573" text-anchor="middle" fill="#1F1F1F" font-size="15" font-weight="600">VM app1 - RHEL 9.5</text>
  <text x="230" y="591" text-anchor="middle" fill="#333333" font-size="12.5">ens224 10.0.1.2 - ens256 net-data .5</text>
  <rect x="95" y="600" width="270" height="24" rx="3" fill="#FDE2EC" stroke="#D6457A"/>
  <text x="230" y="616" text-anchor="middle" fill="#6B1A3D" font-size="12.5">DVWA :80 (host network) - sessions in Galera</text>
  <rect x="95" y="630" width="270" height="24" rx="3" fill="#FDE2EC" stroke="#D6457A"/>
  <text x="230" y="646" text-anchor="middle" fill="#6B1A3D" font-size="12.5">HAProxy 127.0.0.1:3306 - db1, db2 backup</text>
  <rect x="95" y="660" width="270" height="24" rx="3" fill="#FDE2EC" stroke="#D6457A"/>
  <text x="230" y="676" text-anchor="middle" fill="#6B1A3D" font-size="12.5">garbd - Galera arbitrator (3rd vote)</text>
  <rect x="500" y="500" width="340" height="200" rx="4" fill="#FFF4CC" stroke="#D9A400"/>
  <text x="670" y="522" text-anchor="middle" fill="#4D3800" font-size="15" font-weight="600">VLAN front2 - 10.0.2.0/29</text>
  <text x="670" y="540" text-anchor="middle" fill="#7A5C00" font-size="12.5">LAN segment - waf1 .3 - waf2 .4</text>
  <rect x="520" y="552" width="300" height="140" rx="4" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.3"/>
  <text x="670" y="573" text-anchor="middle" fill="#1F1F1F" font-size="15" font-weight="600">VM app2 - RHEL 9.5</text>
  <text x="670" y="591" text-anchor="middle" fill="#333333" font-size="12.5">ens224 10.0.2.2 - ens256 net-data .6</text>
  <rect x="535" y="600" width="270" height="24" rx="3" fill="#FDE2EC" stroke="#D6457A"/>
  <text x="670" y="616" text-anchor="middle" fill="#6B1A3D" font-size="12.5">DVWA :80 (host network) - sessions in Galera</text>
  <rect x="535" y="630" width="270" height="24" rx="3" fill="#FDE2EC" stroke="#D6457A"/>
  <text x="670" y="646" text-anchor="middle" fill="#6B1A3D" font-size="12.5">HAProxy 127.0.0.1:3306 - db1, db2 backup</text>
  <text x="670" y="677" text-anchor="middle" fill="#333333" font-size="12.5">firewalld: HTTP from waf1 / waf2 only</text>
  <text x="450" y="722" text-anchor="middle" fill="#1F1F1F" font-size="13.5" font-weight="600">Zone 3 - Applications - one VM per VLAN</text>

  <!-- Zone 4: data tier -->
  <rect x="20" y="760" width="860" height="222" rx="4" fill="none" stroke="#8C8C8C" stroke-dasharray="5 4"/>
  <rect x="60" y="790" width="780" height="160" rx="4" fill="#FFF4CC" stroke="#D9A400"/>
  <text x="450" y="812" text-anchor="middle" fill="#4D3800" font-size="14" font-weight="600">VLAN net-data - 10.0.3.0/28 - no access from the WAF</text>
  <line x1="230" y1="692" x2="230" y2="786" stroke="#555555" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="240" y="750" fill="#555555" font-size="12.5">SQL from 10.0.3.5</text>
  <line x1="670" y1="692" x2="670" y2="786" stroke="#555555" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="680" y="750" fill="#555555" font-size="12.5">SQL from 10.0.3.6</text>
  <rect x="110" y="830" width="280" height="80" rx="4" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.3"/>
  <text x="250" y="853" text-anchor="middle" fill="#1F1F1F" font-size="15" font-weight="600">VM db1 - MariaDB Galera</text>
  <text x="250" y="873" text-anchor="middle" fill="#333333" font-size="12.5">10.0.3.2 - active (all writes)</text>
  <text x="250" y="893" text-anchor="middle" fill="#333333" font-size="12.5">firewalld: 3306 from .5 / .6 only</text>
  <rect x="510" y="830" width="280" height="80" rx="4" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.3"/>
  <text x="650" y="853" text-anchor="middle" fill="#1F1F1F" font-size="15" font-weight="600">VM db2 - MariaDB Galera</text>
  <text x="650" y="873" text-anchor="middle" fill="#333333" font-size="12.5">10.0.3.3 - standby, same data</text>
  <text x="650" y="893" text-anchor="middle" fill="#333333" font-size="12.5">used by both apps if db1 is down</text>
  <line x1="394" y1="870" x2="506" y2="870" stroke="#7A5C00" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="450" y="860" text-anchor="middle" fill="#4D3800" font-size="12.5">Galera</text>
  <text x="450" y="888" text-anchor="middle" fill="#4D3800" font-size="12.5">synchronous</text>
  <text x="450" y="936" text-anchor="middle" fill="#7A5C00" font-size="12.5">Quorum: db1 + db2 + garbd (app1) = 3 votes; the cluster runs with any 2</text>
  <text x="450" y="972" text-anchor="middle" fill="#1F1F1F" font-size="13.5" font-weight="600">Zone 4 - Data - database VMs on net-data only</text>

  <text x="450" y="1006" text-anchor="middle" fill="#2E6B1F" font-size="13.5" font-weight="600">No single point of failure: any one of the 6 VMs can be powered off (tested)</text>

  <!-- legend -->
  <rect x="40" y="1028" width="14" height="14" rx="3" fill="#FFF4CC" stroke="#D9A400"/>
  <text x="62" y="1040" fill="#333333" font-size="12.5">VLAN / VIP</text>
  <rect x="160" y="1028" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.3"/>
  <text x="182" y="1040" fill="#333333" font-size="12.5">VM</text>
  <rect x="230" y="1028" width="14" height="14" rx="3" fill="#FDE2EC" stroke="#D6457A"/>
  <text x="252" y="1040" fill="#333333" font-size="12.5">Service</text>
  <line x1="640" y1="1035" x2="680" y2="1035" stroke="#555555" stroke-dasharray="5 4"/>
  <text x="690" y="1040" fill="#333333" font-size="12.5">standby path</text>
</svg>
